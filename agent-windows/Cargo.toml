[package]
name = "agent-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
sys-info = "0.9"
chrono = "0.4"
base64 = "0.21"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "processthreadsapi", "handleapi", "winbase", "winsvc", "iphlpapi", "wininet"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinInet"] }
